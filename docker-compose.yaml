# 실습용 Airflow 3.3.2 — 컨테이너 하나로 띄웁니다 (airflow standalone).
# 운영용 구성이 아닙니다. 로그인 없이 누구나 관리자로 들어가고, 메타스토어는 SQLite입니다.
#
#   docker compose up        # 1~2분 뒤 http://localhost:8080
#   docker compose down      # 종료 (실행 기록도 함께 사라짐)
#
# 8080 포트를 이미 쓰고 있다면 (macOS·Linux·WSL): AIRFLOW_PORT=8081 docker compose up
#                       (Windows PowerShell): $env:AIRFLOW_PORT="8081"; docker compose up

services:
  airflow:
    image: apache/airflow:3.3.2
    command: standalone
    ports:
      # 로그인이 없으므로 내 컴퓨터(127.0.0.1)에서만 열리게 묶는다
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    environment:
      # 로그인 없이 관리자로 접속 (로컬 실습 전용)
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      # Airflow 기본 예제 DAG는 숨기고 이 저장소의 DAG만 보이게
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      # DAG를 켜진 상태로 올려서 바로 실행되게
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
    volumes:
      - ./dags:/opt/airflow/dags:ro
